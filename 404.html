<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="main.css">
    <link rel="shortcut icon" href="image/icon404.png" type="image/icon404">
    <style>
        .error-container {
            display:flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(200vh - 250vh);
            text-align: center;
            padding: 20px;
        }

        .error-code {
            font-size: 8rem;
            font-weight: bold;
            margin: 0;
            background: linear-gradient(90deg, #ff6ec4, #7873f5, #00f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulse 2s infinite;
        }

        .error-message {
            font-size: 1.5rem;
            margin-bottom: 30px;
        }

        .btn-home {
            padding: 12px 30px;
            background-color: var(--nav-bg);
            color: white;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 2px solid transparent;
        }
        .btn-home:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px var(--box-shadow);
            text-decoration: none;
            border-color: #00f0ff;
        }
        
        @keyframes pulse {
            0% {transform: scale(1);}
            50% {transform: scale(1.05);}
            100% {transform: scale(1);}
        }
    </style>
</head>
<body>
    <header role="banner">
        <h1>Yelisieiev Yevhenii</h1>
        <p>Ooops! Something went wrong</p>
        <button id="theme-toggle">⚫️</button>
    </header>

    <main class="error-container">
        <div class="card gradient-border">
            <h2 class="error-code">404</h2>
            <p class="error-message">This page seems to have been knocked out by a boxer.</p>
            <a href="index.html" class="btn-home">Return to home</a>
        </div>
    </main>
    <footer role="contentinfo">
        <p> &copy; 2025 Yelisieiev Yevhenii</p>
    </footer>
    <script src="Script.js"></script>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark');
        }
    </script>
</body>
</html>
